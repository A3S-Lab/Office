name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js for the standalone browser
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Office kernel ABI
        run: bun run kernel:test

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-check library
        run: bun run typecheck

      - name: Type-check collaboration server client
        run: bun run collaboration-server:typecheck

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Type-check playground
        run: bun run playground:typecheck

      - name: Build playground
        run: bun run playground:build

      - name: Check playground bundle budget
        run: bun run playground:bundle-check

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install visual-test browser
        run: |
          for ubuntu_source in \
            /etc/apt/apt-mirrors.txt \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "${ubuntu_source}" ]]; then
              sudo sed -i \
                's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "${ubuntu_source}"
            fi
          done
          bunx playwright install --with-deps chromium webkit

      - name: Check controlled IME behavior in WebKit
        run: bun run playground:ime:webkit

      - name: Check editor visual contracts
        run: bun run playground:visual

      - name: Upload visual-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: office-visual-test-diagnostics
          path: |
            playwright-report
            playwright-report-ime-webkit
            test-results/ime-webkit
            test-results/visual
          if-no-files-found: ignore

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check native workspace
        run: cargo check --workspace --all-targets

      - name: Test native workspace
        run: cargo test --workspace

      - name: Test optional native PDFium layout provider
        env:
          PDFIUM_ARCHIVE_SHA256: 1470e21b8b4a3b4ad7f85684e2da11d94f3b69a86d81dee11b9b6709d927ac1d
        run: |
          pdfium_test_dir="$(mktemp -d)"
          curl --fail --location --retry 3 \
            --output "${pdfium_test_dir}/pdfium.tgz" \
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-linux-x64.tgz
          printf '%s  %s\n' "${PDFIUM_ARCHIVE_SHA256}" "${pdfium_test_dir}/pdfium.tgz" | sha256sum --check --strict
          tar -xzf "${pdfium_test_dir}/pdfium.tgz" -C "${pdfium_test_dir}"
          A3S_OFFICE_TEST_PDFIUM_LIBRARY="${pdfium_test_dir}/lib/libpdfium.so" \
            cargo test -p a3s-office --locked --features pdfium --all-targets

      - name: Inspect npm package
        run: bun pm pack --dry-run
