name: Deploy A3S Office Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js for the standalone browser
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify library
        run: |
          bun run typecheck
          bun run test

      - name: Build library
        run: bun run build

      - name: Type-check playground
        run: bun run playground:typecheck

      - name: Build Playground homepage and documentation center
        run: bun run playground:build

      - name: Check playground bundle budget
        run: bun run playground:bundle-check

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install visual-test browser
        run: bunx playwright install --with-deps chromium

      - name: Install the A3S Test browser gate
        run: bash scripts/install-a3s-test-ci.sh

      - name: Check editor visual contracts
        run: bun run playground:visual

      - name: Upload visual-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: office-pages-visual-test-diagnostics
          path: |
            playwright-report
            test-results/visual
          if-no-files-found: ignore

      - name: Check documentation and collaboration deployment contracts
        run: bash scripts/run-a3s-test-web-gate.sh

      - name: Upload A3S Test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: office-pages-a3s-test-diagnostics
          path: .a3s-test
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Build GitHub Pages website
        run: bun run playground:build
        env:
          A3S_OFFICE_PLAYGROUND_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: playground-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
