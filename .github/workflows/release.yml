name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"

      - name: Verify package
        run: |
          bun run typecheck
          bun run test
          bun run build

      # Publish via npm Trusted Publishing (GitHub Actions OIDC). Do not pass
      # NODE_AUTH_TOKEN: classic tokens that bypass 2FA are restricted, and a
      # stale NPM_TOKEN yields PUT 404 (Office#162). Configure the package's
      # trusted publisher on npmjs.com for this repository + workflow.
      - name: Publish package
        run: npm publish --access public --provenance
