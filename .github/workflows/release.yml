name: Publish npm package

on:
  release:
    types:
      - published
  # Manual retry. Registry auth is the NPM_TOKEN secret, not Trusted Publishing.
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish (usually main or a v* tag)
        required: true
        default: main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Registry auth is the NPM_TOKEN secret, written in the publish step.
          # Leave registry-url unset so setup-node does not add an empty token line.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        if: github.event_name == 'release'
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - name: Verify package
        run: |
          bun run typecheck
          bun run test
          bun run build

      # Registry login is NPM_TOKEN. id-token stays so `npm publish --provenance`
      # can sign the attestation; it is not used to authenticate to the registry.
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is empty"
            exit 1
          fi
          if [ -f "$HOME/.npmrc" ]; then
            sed -i '/_authToken/d' "$HOME/.npmrc" || true
          fi
          if [ -f .npmrc ]; then
            sed -i '/_authToken/d' .npmrc || true
          fi
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
          echo "Publishing as $(npm whoami --registry https://registry.npmjs.org/)"
          npm publish --access public --provenance --registry https://registry.npmjs.org/
