<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">A3S Office has two execution planes controlled by the host product</title>
  <desc id="desc">The host product controls embedded browser editors and deterministic native automation through typed boundaries for five Office file surfaces.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7fb"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#dce3ec" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)" opacity="0.72"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="67" fill="#142033" font-size="40" font-weight="750" letter-spacing="-1.2">Two execution planes. Your host stays in control.</text>
    <text x="65" y="101" fill="#526078" font-size="24" font-weight="500">Interactive editing and deterministic automation share typed boundaries.</text>

    <rect x="384" y="128" width="432" height="76" rx="18" fill="#142033"/>
    <rect x="398" y="142" width="48" height="48" rx="12" fill="#1456f0"/>
    <path d="M412 153h14l7 7v23h-21Z" fill="#ffffff"/>
    <path d="M426 153v8h8" fill="none" stroke="#bfd2ff" stroke-width="2"/>
    <text x="470" y="164" fill="#ffffff" font-size="29" font-weight="700">Host product</text>
    <text x="470" y="187" fill="#b8c1d1" font-size="20" font-weight="500">content · persistence · identity · AI</text>

    <path d="M600 204v27M600 231H315v24M600 231h285v24" fill="none" stroke="#8995a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="600" cy="231" r="6" fill="#1456f0"/>

    <rect x="64" y="255" width="502" height="184" rx="22" fill="#ffffff" stroke="#b8c9ee" stroke-width="2"/>
    <rect x="64" y="255" width="12" height="184" rx="6" fill="#1456f0"/>
    <text x="100" y="300" fill="#1b2d52" font-size="31" font-weight="750">Browser editing</text>
    <text x="100" y="331" fill="#526078" font-size="22" font-weight="500">React · Vue 3 · Web Components · Core API</text>
    <g font-size="19" font-weight="700">
      <g transform="translate(100 355)">
        <rect width="84" height="38" rx="10" fill="#e8efff"/>
        <text x="18" y="26" fill="#1456f0">DOC</text>
      </g>
      <g transform="translate(194 355)">
        <rect width="88" height="38" rx="10" fill="#e7f5ef"/>
        <text x="13" y="26" fill="#16845b">SHEET</text>
      </g>
      <g transform="translate(292 355)">
        <rect width="92" height="38" rx="10" fill="#fff0e9"/>
        <text x="13" y="26" fill="#b74e28">SLIDES</text>
      </g>
      <g transform="translate(394 355)">
        <rect width="62" height="38" rx="10" fill="#edf0f3"/>
        <text x="16" y="26" fill="#526078">MD</text>
      </g>
      <g transform="translate(466 355)">
        <rect width="64" height="38" rx="10" fill="#fdecee"/>
        <text x="15" y="26" fill="#b33a48">PDF</text>
      </g>
    </g>
    <text x="100" y="421" fill="#526078" font-size="21" font-weight="500">typed changes · Workers · Rust/WASM · PDFium</text>

    <rect x="634" y="255" width="502" height="184" rx="22" fill="#ffffff" stroke="#c9c2e7" stroke-width="2"/>
    <rect x="1124" y="255" width="12" height="184" rx="6" fill="#7457c8"/>
    <text x="670" y="300" fill="#322453" font-size="31" font-weight="750">Native automation</text>
    <text x="670" y="331" fill="#526078" font-size="22" font-weight="500">CLI · standard MCP · Office Skill</text>
    <rect x="670" y="355" width="430" height="38" rx="10" fill="#f1edfc"/>
    <text x="690" y="381" fill="#5d46a9" font-size="20" font-weight="700">read · validate · mutate · batch</text>
    <text x="670" y="421" fill="#526078" font-size="21" font-weight="500">Rust core · bounded OOXML contracts</text>

    <path d="M315 439v23h570v-23" fill="none" stroke="#8995a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="339" y="458" width="522" height="42" rx="21" fill="#ffffff" stroke="#cfd7e5" stroke-width="2"/>
    <text x="395" y="486" fill="#142033" font-size="22" font-weight="700" letter-spacing="1.2">DOCX · MD · XLSX · PPTX · PDF</text>
  </g>
</svg>
