<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">A3S Office — Office editing inside your product</title>
  <desc id="desc">Five format-native Office surfaces run inside a host-owned product boundary for data, identity, collaboration, and AI.</desc>

